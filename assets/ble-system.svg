<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t"><title id="t">Conceptual BLE topology, not a wiring diagram</title><rect width="1200" height="300" fill="#000"/><g font-family="Inter,Arial,sans-serif" fill="#fff"><text x="38" y="48" font-size="27" font-weight="600">One button. Three boards.</text><text x="38" y="77" fill="#aaa" font-size="16">A wireless command follows a physical input.</text><g fill="none" stroke="#ddd" stroke-width="2"><circle cx="98" cy="173" r="30"/><circle cx="98" cy="173" r="16"/><path d="M128 173h127"/><rect x="255" y="113" width="190" height="120" rx="6"/><rect x="280" y="132" width="64" height="64"/><path d="M445 173h115l60-69h110M560 173l60 56h110" stroke-dasharray="5 6"/><rect x="730" y="65" width="225" height="79" rx="5"/><rect x="730" y="190" width="225" height="79" rx="5"/><circle cx="1008" cy="105" r="13"/><circle cx="1008" cy="230" r="13"/><path d="M955 105h40M955 230h40"/></g><text x="98" y="244" text-anchor="middle" font-size="16" fill="#aaa">Pushbutton</text><text x="312" y="170" text-anchor="middle" font-size="15">ESP32</text><text x="362" y="215" font-size="17">Master</text><text x="570" y="159" font-size="14" fill="#aaa">BLE</text><text x="755" y="97" font-size="18">Peripheral 1</text><text x="755" y="124" font-size="14" fill="#aaa">ESP32 / LED output</text><text x="755" y="222" font-size="18">Peripheral 2</text><text x="755" y="249" font-size="14" fill="#aaa">ESP32-S3 / LED output</text><text x="1060" y="112" font-size="16">ON / OFF</text><text x="1060" y="237" font-size="16">ON / OFF</text></g></svg>
